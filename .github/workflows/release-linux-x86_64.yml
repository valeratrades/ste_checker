env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
jobs:
  build:
    if: needs.gate.outputs.run == 'true'
    needs:
      - gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch tags
        run: git fetch --tags --force --no-recurse-submodules
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install mold
        uses: rui314/setup-mold@v1
      - name: Remove .cargo/config.toml
        run: rm -f "$GITHUB_WORKSPACE/.cargo/config.toml" "$GITHUB_WORKSPACE/.cargo/config"
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Package binary
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          PNAME="${GITHUB_REPOSITORY##*/}"
          tar -czvf "$GITHUB_WORKSPACE/${PNAME}-x86_64-unknown-linux-gnu.tar.gz" $PNAME
      - id: version
        name: Resolve version tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            LATEST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
            if [[ -n "$LATEST" ]]; then
              echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::No existing v* tags found, skipping versioned release"
              echo "tag=" >> "$GITHUB_OUTPUT"
            fi
          fi
        shell: bash
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Release (latest)
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.event.repository.name }}-x86_64-unknown-linux-gnu.tar.gz
          make_latest: false
          name: Latest linux-x86_64
          prerelease: true
          tag_name: latest-linux-x86_64
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.version.outputs.tag != ''
        name: Release (versioned)
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.event.repository.name }}-x86_64-unknown-linux-gnu.tar.gz
          tag_name: ${{ steps.version.outputs.tag }}
  gate:
    outputs:
      run: ${{ steps.check.outputs.run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: check
        run: |
          if [ "$(git show HEAD~1:ste_checker/Cargo.toml | grep '^version' | head -1)" != "$(grep '^version' ste_checker/Cargo.toml | head -1)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
name: Release linux-x86_64
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: write
